name: C/C++ CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-ubuntu:
    name: Build on Ubuntu Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Configure and Build CMake
        run: |
          mkdir build
          cd build
          cmake ..
          make

      - name: Run Build Test
        run: |
          cd build
          if [ -f "./itwoma" ]; then
            echo "Sucesso! O executável foi gerado eehhh."
          else
            echo "Erro: Executável não encontrado!"
            exit 1
          fi